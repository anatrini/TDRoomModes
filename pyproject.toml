[project]
name = "tdroommodes"
version = "1.0.0"
description = "The resonances of real rooms, computed with the finite element method and played in real time in TouchDesigner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessandro Anatrini" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-fem>=10.0",
    "gmsh>=4.12",
    "trimesh>=4.0",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "pytetwild>=0.4.2",
    "pyvista>=0.49.1",
    "networkx>=3.6.1",
]

[project.scripts]
tdroommodes = "tdroommodes.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "nbformat>=5.9"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdroommodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
