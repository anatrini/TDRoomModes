[project]
name = "acousticfem"
version = "3.0.0"
description = "Room acoustic modes with the finite element method, for analysis and for artistic use (animation, TouchDesigner)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessandro Anatrini" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-fem>=10.0",
    "gmsh>=4.12",
    "trimesh>=4.0",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "pytetwild>=0.4.2",
    "pyvista>=0.49.1",
    "networkx>=3.6.1",
]

[project.scripts]
acousticfem = "acousticfem.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "nbformat>=5.9"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acousticfem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
