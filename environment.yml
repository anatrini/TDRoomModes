name: acoustics
channels:
  - conda-forge
dependencies:
  - python=3.11
  # FEM solver (modern FEniCSx - works on Apple Silicon!)
  - fenics-dolfinx
  - mpich
  # Scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  # Mesh processing
  - trimesh>=4.0
  - meshio>=5.3
  # Visualization
  - pyvista
  - plotly>=5.14
  - matplotlib>=3.7
  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.65
  - h5py>=3.8
  # Test harness
  - pytest>=8,<9
  # Mesh repair
  - pip
  - pip:
    - pymeshlab>=2022.2
